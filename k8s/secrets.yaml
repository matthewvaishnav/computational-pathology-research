apiVersion: v1
kind: Secret
metadata:
  name: medical-ai-secrets
  namespace: medical-ai
type: Opaque
data:
  # Base64 encoded secrets - CHANGE THESE IN PRODUCTION!
  # To encode: echo -n "your-secret" | base64
  
  # Database credentials - REPLACE WITH ACTUAL VALUES FROM SECRETS MANAGER
  # POSTGRES_PASSWORD: <base64-encoded-password>
  # DATABASE_URL: <base64-encoded-connection-string>
  
  # API Security
  SECRET_KEY: eW91ci1zZWNyZXQta2V5LWhlcmUtY2hhbmdlLWluLXByb2R1Y3Rpb24=  # your-secret-key-here-change-in-production
  JWT_SECRET_KEY: eW91ci1qd3Qtc2VjcmV0LWtleS1oZXJl  # your-jwt-secret-key-here
  JWT_ALGORITHM: SFMyNTY=  # HS256
  
  # External API Keys (if needed)
  # SLACK_WEBHOOK_URL: ""
  # SMTP_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: medical-ai
type: Opaque
data:
  # Database credentials - REPLACE WITH ACTUAL VALUES FROM SECRETS MANAGER
  # POSTGRES_PASSWORD: <base64-encoded-password>