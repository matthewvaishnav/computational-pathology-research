# Configuration for Colorectal Cancer Tissue Classification
# Dataset: NCT-CRC-HE-100K (train) + CRC-VAL-HE-7K (val)
# Task: 9-class tissue classification

# Random seed for reproducibility
seed: 42

# Device configuration
device: cuda

# Data configuration
data:
  train_dir: c:/Users/matth/computational-pathology-research/data/multi_disease/colon/nct_crc/NCT-CRC-HE-100K
  val_dir: c:/Users/matth/computational-pathology-research/data/multi_disease/colon/CRC-VAL-HE-7K
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

# Training configuration
training:
  batch_size: 64
  num_epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001

# Checkpoint configuration
checkpoint:
  checkpoint_dir: checkpoints/colorectal
  save_frequency: 1  # Save every N epochs

# Task configuration
task:
  name: colorectal_classification
  num_classes: 9
  classes:
    - ADI    # Adipose tissue
    - BACK   # Background
    - DEB    # Debris
    - LYM    # Lymphocytes
    - MUC    # Mucus
    - MUS    # Smooth muscle
    - NORM   # Normal colon mucosa
    - STR    # Cancer-associated stroma
    - TUM    # Colorectal adenocarcinoma epithelium
