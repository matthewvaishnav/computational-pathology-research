# TransnnMIL configuration for PatchCamelyon
# Dual-branch fusion of TransMIL and nnMIL
# Fast training configuration for initial testing

data:
  root_dir: "data/pcam_real"
  num_workers: 0  # Windows limitation
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false
  download: false

model:
  model_type: "transnnmil"  # Use TransnnMIL fusion model
  embed_dim: 256
  
  feature_extractor:
    model: "resnet18"
    pretrained: true
    feature_dim: 512
  
  # TransnnMIL specific configuration
  transnnmil:
    num_layers: 2      # Transformer layers in Branch A
    num_heads: 8       # Attention heads in Branch A
    use_pos_encoding: false  # Disabled for random sub-bags
  
  wsi:
    input_dim: 512
    hidden_dim: 256
    num_heads: 8
    num_layers: 2
    pooling: "mean"

task:
  type: "classification"
  
  classification:
    hidden_dims: []
    dropout: 0.5

training:
  batch_size: 128    # Moderate batch size for dual-branch model
  num_epochs: 10     # Quick test run
  learning_rate: 0.001
  weight_decay: 0.01
  max_grad_norm: 1.0
  use_amp: true
  dropout: 0.1       # TransMIL dropout rate
  
  use_torch_compile: false
  channels_last: true
  
  warmup_epochs: 1
  
  optimizer:
    name: "adamw"
    betas: [0.9, 0.999]
  
  scheduler:
    name: "cosine"
    min_lr: 1e-6

validation:
  interval: 1  # Validate every epoch to monitor gate evolution
  metric: "val_auc"
  maximize: true

checkpoint:
  checkpoint_dir: "checkpoints/transnnmil_pcam"
  save_interval: 5
  save_best: true

early_stopping:
  enabled: true
  patience: 5
  min_delta: 0.001

device: "cuda"
cudnn_benchmark: true
seed: 42
  
logging:
  log_dir: "logs/transnnmil_pcam"
  log_interval: 50
  use_tensorboard: true
  use_wandb: false

