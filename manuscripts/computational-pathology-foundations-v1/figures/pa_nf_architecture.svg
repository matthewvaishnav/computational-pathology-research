<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520">
  <rect x="0" y="0" width="1800" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#1f2933"/>
    </marker>
    <style>
      .box { fill:#f7f8fa; stroke:#374151; stroke-width:2.2; rx:8; ry:8; }
      .latent { fill:#eef3f8; stroke:#374151; stroke-width:2.2; rx:8; ry:8; }
      .control { fill:#fff7d6; stroke:#374151; stroke-width:2.2; rx:8; ry:8; }
      .line { fill:none; stroke:#1f2933; stroke-width:3; marker-end:url(#arrow); }
      .dash { fill:none; stroke:#1f2933; stroke-width:3; stroke-dasharray:10 8; marker-end:url(#arrow); }
      text { font-family:"Times New Roman", Times, serif; fill:#111827; text-anchor:middle; }
      .label { font-size:27px; }
      .math { font-size:30px; font-style:italic; }
      .sub { font-size:18px; font-style:italic; }
      .sup { font-size:18px; }
    </style>
  </defs>

  <rect class="box" x="25" y="35" width="230" height="92"/>
  <text class="label" x="140" y="72"><tspan x="140">same region</tspan><tspan x="140" dy="35">scanner s₁</tspan></text>
  <rect class="box" x="25" y="180" width="230" height="92"/>
  <text class="label" x="140" y="217"><tspan x="140">same region</tspan><tspan x="140" dy="35">scanner s₂</tspan></text>

  <rect class="latent" x="330" y="35" width="250" height="92"/>
  <text class="label" x="455" y="72"><tspan x="455">shared tissue</tspan><tspan x="455" dy="35">encoder fₜ</tspan></text>
  <rect class="latent" x="330" y="180" width="250" height="92"/>
  <text class="label" x="455" y="217"><tspan x="455">shared tissue</tspan><tspan x="455" dy="35">encoder fₜ</tspan></text>

  <rect class="latent" x="660" y="43" width="170" height="76"/>
  <text class="math" x="720" y="91">z</text><text class="sub" x="760" y="102">tissue</text><text class="sup" x="800" y="70">(1)</text>
  <rect class="latent" x="660" y="188" width="170" height="76"/>
  <text class="math" x="720" y="236">z</text><text class="sub" x="760" y="247">tissue</text><text class="sup" x="800" y="215">(2)</text>

  <rect class="control" x="900" y="125" width="355" height="100"/>
  <text class="label" x="1077.5" y="165"><tspan x="1077.5">paired agreement</tspan><tspan x="1077.5" dy="36">variance/dependence control</tspan></text>

  <rect class="box" x="1100" y="20" width="305" height="86"/>
  <text class="label" x="1252.5" y="56"><tspan x="1252.5">tissue scanner head</tspan><tspan x="1252.5" dy="34">gradient reversed</tspan></text>

  <rect class="latent" x="330" y="345" width="250" height="92"/>
  <text class="label" x="455" y="382"><tspan x="455">acquisition</tspan><tspan x="455" dy="35">encoder fₐ</tspan></text>
  <rect class="latent" x="660" y="353" width="170" height="76"/>
  <text class="math" x="720" y="401">z</text><text class="sub" x="760" y="412">acq</text>
  <rect class="box" x="920" y="390" width="340" height="86"/>
  <text class="label" x="1090" y="425"><tspan x="1090">acquisition scanner head</tspan><tspan x="1090" dy="34">ordinary gradient</tspan></text>

  <rect class="latent" x="1310" y="235" width="285" height="100"/>
  <text class="label" x="1452.5" y="272"><tspan x="1452.5">joint decoder</tspan><tspan x="1452.5" dy="38" font-size="23">g([z_tissue; z_acq])</tspan></text>
  <rect class="control" x="1625" y="235" width="165" height="100"/>
  <text class="label" x="1707.5" y="270"><tspan x="1707.5">reconstruct x</tspan><tspan x="1707.5" dy="36" font-size="19">cross-factor control</tspan></text>

  <path class="line" d="M255 81 H330"/>
  <path class="line" d="M255 226 H330"/>
  <path class="line" d="M580 81 H660"/>
  <path class="line" d="M580 226 H660"/>
  <path class="line" d="M830 81 H860 V150 H900"/>
  <path class="line" d="M830 226 H860 V200 H900"/>
  <path class="dash" d="M1078 125 V105 H1100"/>
  <path class="line" d="M140 272 V391 H330"/>
  <path class="line" d="M580 391 H660"/>
  <path class="dash" d="M830 391 H875 V433 H920"/>
  <path class="line" d="M1255 175 H1285 V265 H1310"/>
  <path class="line" d="M830 391 H1285 V305 H1310"/>
  <path class="line" d="M1595 285 H1625"/>
</svg>
