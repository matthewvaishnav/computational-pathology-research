# Local/research Alertmanager example.
# External email, Slack, PagerDuty, and other credentialed integrations are
# intentionally omitted. Render a separate untracked configuration with secrets
# supplied by your secret manager if those integrations are needed.
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'severity']
  group_wait: 10s
  group_interval: 10m
  repeat_interval: 12h
  receiver: local-webhook

receivers:
  - name: local-webhook
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'cluster']
