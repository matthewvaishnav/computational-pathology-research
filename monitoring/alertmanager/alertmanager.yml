# Local/research Alertmanager example for historical monitoring scaffolding.
# No external service credentials are stored in this repository.
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'component']
  group_wait: 10s
  group_interval: 10m
  repeat_interval: 1h
  receiver: local-webhook

receivers:
  - name: local-webhook
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true
