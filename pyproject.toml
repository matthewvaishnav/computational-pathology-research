[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "histocore"
version = "1.0.0"
description = "Production-grade computational pathology framework"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Matthew Vaishnav"}
]
keywords = ["pathology", "deep-learning", "medical-imaging", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "torch>=2.0.0,<3.0.0",
    "torchvision>=0.15.0,<1.0.0",
    "fastapi==0.136.1",
    "uvicorn==0.46.0",
    "pydantic==2.13.3",
    "cryptography>=41.0.0,<43.0.0",
    "h5py>=3.8.0,<4.0.0",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scikit-learn>=1.2.0,<2.0.0",
    "pydicom>=2.3.0,<3.0.0",
    "openslide-python>=1.2.0,<2.0.0",
    "Pillow>=9.0.0,<11.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "tensorboard>=2.12.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "tqdm>=4.65.0,<5.0.0",
    "SQLAlchemy==2.0.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0,<8.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "hypothesis>=6.0.0,<7.0.0",
    "black>=23.0.0,<25.0.0",
    "ruff>=0.1.0,<1.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pre-commit>=3.0.0,<4.0.0",
    "safety>=2.3.0,<4.0.0",
    "jupyter>=1.0.0,<2.0.0",
    "ipywidgets>=8.0.0,<9.0.0",
]

cloud = [
    "azure-identity>=1.15.0,<2.0.0",
    "azure-mgmt-web>=7.0.0,<8.0.0",
    "azure-storage-blob>=12.19.0,<13.0.0",
    "aiohttp>=3.9.0,<4.0.0",
]

ml = [
    "timm>=0.9.0,<1.0.0",
    "torch-geometric>=2.3.0,<3.0.0",
    "umap-learn>=0.5.0,<1.0.0",
]

federated = [
    "flwr[simulation]>=1.5.0,<2.0.0",
    "redis==7.4.0",
]

all = [
    "histocore[cloud,dev,ml,federated]",
]

[project.scripts]
histocore = "histocore:main"

[project.urls]
Homepage = "https://github.com/matthewvaishnav/histocore"
Documentation = "https://github.com/matthewvaishnav/histocore/docs"
Repository = "https://github.com/matthewvaishnav/histocore"
Issues = "https://github.com/matthewvaishnav/histocore/issues"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "openslide.*",
    "h5py.*",
    "sklearn.*",
    "torch_geometric.*",
    "timm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
