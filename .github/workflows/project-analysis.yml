name: Project Analysis

# TEMPORARILY DISABLED - YAML syntax error at line 148
# Re-enable after fixing the unclosed Python string in regression detection step
on:
  workflow_dispatch:
  # push:
  #   branches: [ main, develop ]
  # pull_request:
  #   branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      contents: read
      pull-requests: write
      actions: read
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for baseline comparison
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libssl-dev \
          libffi-dev \
          python3-dev \
          git \
          curl \
          wget
          
    - name: Install analysis dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install \
          radon>=5.1.0 \
          pylint>=2.17.0 \
          flake8>=6.0.0 \
          mypy>=1.0.0 \
          bandit>=1.7.5 \
          safety>=2.3.0 \
          pip-audit>=2.5.0 \
          pip-licenses>=4.3.0 \
          pytest-cov>=4.1.0 \
          coverage>=7.2.0 \
          matplotlib>=3.7.0 \
          plotly>=5.14.0 \
          pandas>=2.0.0 \
          tabulate>=0.9.0 \
          jsonschema>=4.17.0 \
          tenacity>=8.2.0
          
    - name: Install Docker tools (optional)
      run: |
        # Install hadolint for Dockerfile linting
        wget -O /tmp/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
        chmod +x /tmp/hadolint
        sudo mv /tmp/hadolint /usr/local/bin/hadolint
        
    - name: Create analysis output directory
      run: mkdir -p analysis_output
      
    - name: Run project analysis
      id: analysis
      run: |
        echo "Running comprehensive project analysis..."
        
        # Set analysis parameters
        export ANALYSIS_OUTPUT_DIR="analysis_output"
        export ANALYSIS_FORMAT="json"
        export ANALYSIS_PARALLEL="true"
        
        # Run the analysis orchestrator
        python -m src.analysis.orchestrator \
          --project-path . \
          --output analysis_output/current_analysis.json \
          --format json \
          --parallel \
          --timeout 1800 || echo "Analysis completed with warnings"
          
        # Check if analysis file was created
        if [ -f "analysis_output/current_analysis.json" ]; then
          echo "analysis_success=true" >> $GITHUB_OUTPUT
          echo "Analysis completed successfully"
        else
          echo "analysis_success=false" >> $GITHUB_OUTPUT
          echo "Analysis failed - creating minimal report"
          echo '{"error": "Analysis failed", "timestamp": "'$(date -Iseconds)'"}' > analysis_output/current_analysis.json
        fi
        
    - name: Fetch baseline analysis (for PR comparison)
      if: github.event_name == 'pull_request'
      run: |
        echo "Fetching baseline analysis from main branch..."
        
        # Try to download baseline from main branch artifacts
        gh run list \
          --branch main \
          --workflow "project-analysis.yml" \
          --status success \
          --limit 1 \
          --json databaseId,headSha > latest_main_run.json || echo "No recent runs found"
          
        if [ -s latest_main_run.json ] && [ "$(cat latest_main_run.json)" != "[]" ]; then
          RUN_ID=$(jq -r '.[0].databaseId' latest_main_run.json)
          echo "Downloading baseline from run $RUN_ID"
          
          gh run download $RUN_ID \
            --name analysis-results \
            --dir baseline_analysis || echo "Baseline download failed"
            
          if [ -f "baseline_analysis/current_analysis.json" ]; then
            mv baseline_analysis/current_analysis.json analysis_output/baseline_analysis.json
            echo "Baseline analysis downloaded successfully"
          else
            echo "Baseline analysis not found - skipping regression detection"
          fi
        else
          echo "No baseline analysis available - skipping regression detection"
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Run regression detection
      if: github.event_name == 'pull_request' && steps.analysis.outputs.analysis_success == 'true'
      id: regression
      run: |
        if [ -f "analysis_output/baseline_analysis.json" ]; then
          echo "Running regression detection..."
          
          python -c "
import sys
sys.path.append('.')
from src.analysis.regression_detector import RegressionDetector

try:
    detector = RegressionDetector(coverage_threshold=2.0, performance_threshold=10.0)
    
    # Load baseline and current results
    baseline = detector.load_baseline('analysis_output/baseline_analysis.json')
    current = detector.load_baseline('analysis_output/current_analysis.json')
    
    # Detect regressions
    report = detector.detect_regressions(baseline, current)
    
    # Generate diff report
    diff_report = detector.generate_diff_report(baseline, current, report)
    
    # Save reports
    with open('analysis_output/regression_report.md', 'w') as f:
        f.write(diff_report)
        
    # Set outputs for CI
    print(f'has_regressions={str(report.has_regressions).lower()}')
    print(f'critical_count={len(report.critical_regressions)}')
    print(f'should_fail_ci={str(report.should_fail_ci()).lower()}')
    
    # Exit with appropriate code
    exit_code = detector.exit_code_for_ci(report)
    print(f'exit_code={exit_code}')
    
    if exit_code != 0:
        print('CRITICAL REGRESSIONS DETECTED - BUILD SHOULD FAIL')
        print(report.summary)
        
except Exception as e:
    print(f'Regression detection failed: {e}')
    print('has_regressions=false')
    print('critical_count=0')
    print('should_fail_ci=false')
    print('exit_code=0')
" | tee regression_output.txt
          
          # Parse outputs
          export $(grep -E '^(has_regressions|critical_count|should_fail_ci|exit_code)=' regression_output.txt)
          
          echo "has_regressions=$has_regressions" >> $GITHUB_OUTPUT
          echo "critical_count=$critical_count" >> $GITHUB_OUTPUT  
          echo "should_fail_ci=$should_fail_ci" >> $GITHUB_OUTPUT
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          
        else
          echo "No baseline available - skipping regression detection"
          echo "has_regressions=false" >> $GITHUB_OUTPUT
          echo "critical_count=0" >> $GITHUB_OUTPUT
          echo "should_fail_ci=false" >> $GITHUB_OUTPUT
          echo "exit_code=0" >> $GITHUB_OUTPUT
        fi
        
    - name: Generate analysis summary
      if: steps.analysis.outputs.analysis_success == 'true'
      run: |
        echo "Generating analysis summary..."
        
        python -c "
import sys
sys.path.append('.')
from src.analysis.models import AnalysisResult
import json

try:
    # Load current analysis
    with open('analysis_output/current_analysis.json', 'r') as f:
        result = AnalysisResult.from_json(f.read())
    
    # Generate summary
    summary = f'''# 📊 Project Analysis Summary
    
**Overall Score**: {result.overall_score:.1f}/100
**Timestamp**: {result.timestamp}
**Commit**: {result.git_commit[:8]}

## Key Metrics
- **Architecture**: {result.architecture.score:.1f}/100
- **Performance**: {result.performance.score:.1f}/100  
- **Coverage**: {result.coverage.score:.1f}/100 (Line: {result.coverage.line_coverage:.1f}%, Branch: {result.coverage.branch_coverage:.1f}%)
- **Code Quality**: {result.code_quality.score:.1f}/100 (Avg Complexity: {result.code_quality.average_complexity:.1f})
- **Dependencies**: {result.dependencies.score:.1f}/100 ({len(result.dependencies.vulnerabilities)} vulnerabilities)
- **Deployment**: {result.deployment.score:.1f}/100
- **Security**: {result.security.score:.1f}/100 ({len(result.security.vulnerabilities)} issues)
- **Scalability**: {result.scalability.score:.1f}/100

## Critical Issues
'''
    
    if result.critical_issues:
        for i, issue in enumerate(result.critical_issues[:5], 1):
            summary += f'{i}. **[{issue.priority.value}]** {issue.title} ({issue.dimension})\n'
        if len(result.critical_issues) > 5:
            summary += f'... and {len(result.critical_issues) - 5} more issues\n'
    else:
        summary += 'No critical issues detected ✅\n'
        
    summary += f'''
## 📈 Analysis Details
- **Total Files Analyzed**: {result.architecture.total_files}
- **Large Files (>500 lines)**: {len(result.architecture.large_files)}
- **Circular Dependencies**: {len(result.architecture.circular_dependencies)}
- **Performance Bottlenecks**: {len(result.performance.bottlenecks)}
- **Untested Critical Paths**: {len(result.coverage.untested_critical_paths)}
- **High Complexity Functions**: {len(result.code_quality.high_complexity_functions)}

[View Full Analysis Report](analysis_output/current_analysis.json)
'''
    
    with open('analysis_output/summary.md', 'w') as f:
        f.write(summary)
        
    print('Analysis summary generated successfully')
    
except Exception as e:
    print(f'Summary generation failed: {e}')
    with open('analysis_output/summary.md', 'w') as f:
        f.write(f'# Analysis Summary\n\nAnalysis completed with errors: {e}')
"
        
    - name: Post PR comment
      if: github.event_name == 'pull_request' && steps.analysis.outputs.analysis_success == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          try {
            // Read analysis summary
            let summary = '';
            if (fs.existsSync('analysis_output/summary.md')) {
              summary = fs.readFileSync('analysis_output/summary.md', 'utf8');
            } else {
              summary = '# Analysis Summary\n\nAnalysis summary not available.';
            }
            
            // Add regression information if available
            const hasRegressions = '${{ steps.regression.outputs.has_regressions }}' === 'true';
            const criticalCount = parseInt('${{ steps.regression.outputs.critical_count }}' || '0');
            
            if (hasRegressions) {
              let regressionSummary = '\n\n## 🚨 Regression Analysis\n\n';
              
              if (criticalCount > 0) {
                regressionSummary += `**⚠️ ${criticalCount} CRITICAL regressions detected!**\n\n`;
                regressionSummary += 'This PR introduces critical regressions that may block the build.\n';
              } else {
                regressionSummary += '**ℹ️ Non-critical regressions detected.**\n\n';
                regressionSummary += 'This PR introduces some regressions but they are not critical.\n';
              }
              
              // Add regression report if available
              if (fs.existsSync('analysis_output/regression_report.md')) {
                const regressionReport = fs.readFileSync('analysis_output/regression_report.md', 'utf8');
                regressionSummary += '\n<details>\n<summary>View Detailed Regression Report</summary>\n\n';
                regressionSummary += regressionReport;
                regressionSummary += '\n</details>\n';
              }
              
              summary += regressionSummary;
            } else {
              summary += '\n\n## ✅ Regression Analysis\n\nNo regressions detected compared to baseline.';
            }
            
            // Add footer
            summary += '\n\n---\n*Generated by Project Analysis CI*';
            
            // Post comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
            
            console.log('PR comment posted successfully');
            
          } catch (error) {
            console.error('Failed to post PR comment:', error);
            
            // Post minimal comment on error
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '# 📊 Project Analysis\n\nAnalysis completed but failed to generate detailed summary. Check the workflow logs for details.'
            });
          }
          
    - name: Upload analysis results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: analysis-results
        path: analysis_output/
        retention-days: 30
        
    - name: Fail build on critical regressions
      if: github.event_name == 'pull_request' && steps.regression.outputs.should_fail_ci == 'true'
      run: |
        echo "❌ BUILD FAILED: Critical regressions detected"
        echo "Critical regression count: ${{ steps.regression.outputs.critical_count }}"
        echo ""
        echo "This PR introduces critical regressions that must be fixed before merging."
        echo "Please review the regression report and address the critical issues."
        echo ""
        if [ -f "analysis_output/regression_report.md" ]; then
          echo "Regression details:"
          head -50 analysis_output/regression_report.md
        fi
        exit 1
        
    - name: Analysis completion summary
      if: always()
      run: |
        echo "🎯 Project Analysis Workflow Summary"
        echo "=================================="
        echo "Analysis Success: ${{ steps.analysis.outputs.analysis_success }}"
        echo "Event Type: ${{ github.event_name }}"
        
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "Has Regressions: ${{ steps.regression.outputs.has_regressions }}"
          echo "Critical Regressions: ${{ steps.regression.outputs.critical_count }}"
          echo "Should Fail CI: ${{ steps.regression.outputs.should_fail_ci }}"
        fi
        
        echo ""
        echo "Artifacts uploaded:"
        ls -la analysis_output/ || echo "No analysis output directory"
        
        echo ""
        echo "Workflow completed at $(date)"