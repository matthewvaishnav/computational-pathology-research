name: Bootstrap detect-secrets baseline

on:
  push:
    branches:
      - professional-grade-audit-2026-09-18
    paths:
      - .pre-commit-config.yaml
      - .github/workflows/bootstrap-secrets-baseline.yml

permissions:
  contents: write

jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: professional-grade-audit-2026-09-18

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate baseline
        run: |
          python -m pip install --disable-pip-version-check detect-secrets==1.4.0
          detect-secrets scan --all-files > .secrets.baseline

      - name: Commit baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .secrets.baseline
          if git diff --cached --quiet; then
            echo "Secrets baseline already current"
          else
            git commit -m "Generate detect-secrets baseline"
            git push
          fi
