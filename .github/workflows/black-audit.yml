name: Black Formatting Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  black-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Black
        run: pip install 'black>=23.0.0,<25.0.0'

      - name: Apply Black in the runner workspace
        run: |
          black src/ tests/
          git diff --check
          git diff --name-only -- src/ tests/ > black-formatted-files.txt
          tar -czf black-formatted-files.tar.gz -T black-formatted-files.txt

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: black-formatted-files
          path: |
            black-formatted-files.tar.gz
            black-formatted-files.txt
          if-no-files-found: error
          retention-days: 7
