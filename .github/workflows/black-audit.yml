name: Black Formatting Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  black-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Black
        run: pip install 'black>=23.0.0,<25.0.0'

      - name: Capture Black diff
        id: black
        shell: bash
        run: |
          set +e
          black --check --diff src/ tests/ > black-format.diff 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat black-format.diff
          exit 0

      - name: Upload Black diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-format-diff
          path: black-format.diff
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Black result
        run: exit '${{ steps.black.outputs.status }}'
