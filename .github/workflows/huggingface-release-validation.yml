name: Hugging Face release validation

on:
  pull_request:
    paths:
      - "docs/releases/**"
      - "tools/huggingface/**"
      - "tests/tools/test_huggingface_release.py"
      - ".github/workflows/huggingface-release-validation.yml"
  push:
    branches: [main]
    paths:
      - "docs/releases/**"
      - "tools/huggingface/**"
      - "tests/tools/test_huggingface_release.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/huggingface/requirements.txt pytest black ruff

      - name: Format and lint
        run: |
          black --check tools/huggingface/release.py tests/tools/test_huggingface_release.py
          ruff check tools/huggingface/release.py tests/tools/test_huggingface_release.py

      - name: Unit tests
        run: pytest tests/tools/test_huggingface_release.py -q -o addopts=''

      - name: Registry and card validation
        run: |
          python tools/huggingface/release.py validate-registry docs/releases/huggingface-release-registry.yaml
          python tools/huggingface/release.py validate-card docs/releases/huggingface/paired-acquisition-factorization-evidence/README.md --type dataset
          python tools/huggingface/release.py validate-card docs/releases/huggingface/panda-phikon-wsi-spatial-features/README.md --type dataset

      - name: Public evidence release dry run
        run: |
          python tools/huggingface/release.py prepare docs/releases/huggingface/paired-acquisition-factorization-evidence/release-spec.yaml --repository-root . --output build/huggingface/paired-acquisition-factorization-evidence --dry-run
