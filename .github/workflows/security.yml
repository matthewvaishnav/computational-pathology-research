name: Security Audit

on:
  push:
    branches: [ main ]
  schedule:
    # Run weekly security audit every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  comprehensive-security-audit:
    name: Comprehensive Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml] safety pip-audit
    
    - name: Run comprehensive Bandit scan
      run: |
        bandit -r src/ -f json -o bandit-full-report.json
      continue-on-error: true
    
    - name: Check Bandit results
      run: |
        python scripts/check_bandit_results.py bandit-full-report.json
    
    - name: Generate security report
      if: always()
      run: |
        python scripts/generate_security_report.py bandit-full-report.json security-report.html
    
    - name: Run Safety check (known vulnerabilities)
      run: |
        safety check --json --output safety-report.json
      continue-on-error: true
    
    - name: Run pip-audit (dependency vulnerabilities)
      run: |
        pip-audit --format json --output pip-audit-report.json
      continue-on-error: true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-audit-reports
        path: |
          bandit-full-report.json
          security-report.html
          safety-report.json
          pip-audit-report.json
    
    - name: Comment PR with security summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const bandit = JSON.parse(fs.readFileSync('bandit-full-report.json', 'utf8'));
          const high = bandit.metrics._totals['SEVERITY.HIGH'] || 0;
          const medium = bandit.metrics._totals['SEVERITY.MEDIUM'] || 0;
          const low = bandit.metrics._totals['SEVERITY.LOW'] || 0;
          
          const body = `## 🔒 Security Audit Summary
          
          - **HIGH severity issues:** ${high}
          - **MEDIUM severity issues:** ${medium}
          - **LOW severity issues:** ${low}
          
          ${high > 0 || medium > 0 ? '⚠️ **Action required:** Please review and fix HIGH/MEDIUM severity issues.' : '✅ No HIGH or MEDIUM severity issues found.'}
          
          Full report available in workflow artifacts.`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
