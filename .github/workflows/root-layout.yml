name: Root layout

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-root-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reject loose root documentation and launchers
        run: python scripts/repository/check_root_layout.py
