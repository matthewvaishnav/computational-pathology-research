name: Apply Verified Black Formatting

on:
  push:
    branches: [repo-cleanup-2026-06-10]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: repo-cleanup-2026-06-10
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Apply pinned Black formatting
        run: |
          pip install 'black>=23.0.0,<25.0.0'
          black src/ tests/
          git diff --check
          rm .github/workflows/black-audit.yml .github/workflows/black-apply.yml

      - name: Commit verified formatting
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply Black formatting
          branch: repo-cleanup-2026-06-10
          file_pattern: 'src tests .github/workflows/black-audit.yml .github/workflows/black-apply.yml'
