name: Temporary Gate 2 formatter

on:
  push:
    branches:
      - feature/resumable-factorial-gate2-20260720

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/resumable-factorial-gate2-20260720
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install "black>=23.0.0,<25.0.0" isort
      - name: Apply repository formatting
        run: |
          black src/paired_acquisition_factorial_full.py tests/test_paired_acquisition_factorial_full.py
          isort src/paired_acquisition_factorial_full.py tests/test_paired_acquisition_factorial_full.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/paired_acquisition_factorial_full.py tests/test_paired_acquisition_factorial_full.py
          git commit -m "Format Gate 2 factorial code"
          git push origin HEAD:feature/resumable-factorial-gate2-20260720
