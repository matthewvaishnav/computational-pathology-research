name: Remove Claude attribution once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-claude-attribution-once.yml

permissions:
  contents: write

jobs:
  rewrite-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify protected archive and expected main
        env:
          EXPECTED_MAIN: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          archive=$(git ls-remote origin refs/heads/archive/pre-claude-attribution-cleanup-20260806 | cut -f1)
          test "$remote_main" = "$EXPECTED_MAIN"
          test -n "$archive"
          count=$(git log main --format=%B | grep -Fic 'Co-Authored-By: Claude <noreply@anthropic.com>' || true)
          echo "Claude trailers to remove: $count"
          test "$count" -eq 13

      - name: Rewrite main commit messages only
        env:
          EXPECTED_MAIN: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check git-filter-repo

          cat > /tmp/remove_claude_callback.py <<'PY'
          import re

          text = commit.message.decode("utf-8", errors="replace")
          kept = []
          for line in text.splitlines():
              if re.fullmatch(
                  r"(?i)\s*Co-Authored-By:\s*Claude\s*<noreply@anthropic\.com>\s*",
                  line,
              ):
                  continue
              kept.append(line)
          while kept and not kept[-1].strip():
              kept.pop()
          commit.message = (("\n".join(kept) + "\n") if kept else "").encode("utf-8")
          PY

          before_tree=$(git rev-parse main^{tree})
          git filter-repo --force --refs refs/heads/main \
            --commit-callback "$(cat /tmp/remove_claude_callback.py)"
          after_tree=$(git rev-parse main^{tree})

          test "$before_tree" = "$after_tree"
          remaining=$(git log main --format=%B | grep -Fic 'Co-Authored-By: Claude <noreply@anthropic.com>' || true)
          test "$remaining" -eq 0

          git remote remove origin || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main --force-with-lease=refs/heads/main:${EXPECTED_MAIN}
