name: Reject Claude co-author trailers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-commit-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete comparison history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject Claude attribution
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$SHA"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..$SHA"
          else
            range="$SHA^..$SHA"
          fi

          echo "Auditing commit range: $range"
          if git log "$range" --format=%B | grep -Eqi 'Co-Authored-By:.*Claude|noreply@anthropic\.com'; then
            echo 'Claude co-author attribution is prohibited in this repository.'
            exit 1
          fi

          echo 'No Claude co-author trailers found.'
