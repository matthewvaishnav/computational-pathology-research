name: ScanComp PA-NF 001R two-track contract (synthetic only)
on:
  push:
    branches:
      - scancomp/panf-001r-two-track-protocol-20261110
  pull_request:
    branches:
      - scancomp/registration-qc-20261110
permissions:
  contents: read
jobs:
  python-synthetic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source and tests
        run: python -m compileall -q scripts/external_multiscanner/scancomp_panf_001r_contract.py scripts/external_multiscanner/scancomp_panf_001r_preflight.py scripts/external_multiscanner/scancomp_panf_001r_site_lock.py tests/test_scancomp_panf_001r_site_lock.py tests/test_scancomp_panf_001r_contract.py tests/test_scancomp_panf_001r_preflight.py
      - name: Validate machine-readable protocol lock
        run: python -m json.tool docs/research/scancomp_panf_frozen_001r_protocol_lock.json > /dev/null
      - name: Run standard-library synthetic tests (no WSI/model access)
        run: python -m unittest -v tests.test_scancomp_panf_001r_contract tests.test_scancomp_panf_001r_preflight tests.test_scancomp_panf_001r_site_lock
  tiled-synthetic-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic geometry/QC dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless pillow
      - name: Compile tiled geometry and QC
        run: python -m compileall -q scripts/external_multiscanner/scancomp_panf_001r_tiled.py scripts/external_multiscanner/scancomp_panf_001r_largefield_qc.py scripts/external_multiscanner/scancomp_panf_001r_pilot_bridge.py tests/test_scancomp_panf_001r_pilot_bridge.py tests/test_scancomp_panf_001r_tiled.py
      - name: Run tiled synthetic parity, seam and OOB tests (no TIFF files)
        run: python -m unittest -v tests.test_scancomp_panf_001r_tiled tests.test_scancomp_panf_001r_pilot_bridge
  powershell-windows-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell 5-compatible preflight script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $script = (Resolve-Path 'scripts/external_multiscanner/Run-ScanCompPANF001RPreflight.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PowerShell syntax parsed successfully; no local TIFFs accessed.'
