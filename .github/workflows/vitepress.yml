name: Build and deploy paper PDF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-pages
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare arXiv source package
        run: python paper/arxiv/build_arxiv_package.py

      - name: Apply single-column conference formatting
        run: |
          cp paper/arxiv/identifiability_calculations.tex paper/arxiv/build/identifiability_calculations.tex
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("paper/arxiv/build/main.tex")
          text = path.read_text(encoding="utf-8")

          # AlexNet-style conference structure: one justified text column. Tables
          # and figures may float beside text where useful, but the document is
          # never forced into a global two-column layout.
          text = re.sub(
              r"\documentclass\[[^\]]*\]\{article\}",
              r"\documentclass[10pt]{article}",
              text,
              count=1,
          )
          text = re.sub(
              r"\usepackage\[[^\]]*\]\{geometry\}",
              r"\usepackage[letterpaper,top=0.68in,bottom=0.72in,left=1.02in,right=1.02in]{geometry}",
              text,
              count=1,
          )
          text = re.sub(r"\date\{[^}]*\}", r"\date{June 15, 2026}", text, count=1)

          anchor = r"\usepackage[numbers,sort&compress]{natbib}"
          conference_style = r"""
          \usepackage{titlesec}
          \usepackage{titling}
          \usepackage{wrapfig}

          \setlength{\parindent}{0pt}
          \setlength{\parskip}{0.48em}
          \setlength{\abovedisplayskip}{5pt plus 1pt minus 1pt}
          \setlength{\belowdisplayskip}{5pt plus 1pt minus 1pt}
          \setlength{\textfloatsep}{9pt plus 2pt minus 2pt}
          \setlength{\floatsep}{8pt plus 2pt minus 2pt}
          \setlength{\intextsep}{8pt plus 2pt minus 2pt}
          \emergencystretch=1.2em

          \titleformat{\section}{\large\bfseries}{\thesection}{0.85em}{}
          \titleformat{\subsection}{\normalsize\bfseries}{\thesubsection}{0.75em}{}
          \titlespacing*{\section}{0pt}{1.45em}{0.48em}
          \titlespacing*{\subsection}{0pt}{1.05em}{0.35em}

          \setlength{\droptitle}{-3.2em}
          \pretitle{\begin{center}\hrule height 2.6pt\vspace{0.75em}\LARGE\bfseries}
          \posttitle{\par\vspace{0.75em}\hrule height 0.7pt\end{center}\vspace{0.9em}}
          \preauthor{\begin{center}\normalsize}
          \postauthor{\end{center}\vspace{-0.45em}}
          \predate{\begin{center}\small}
          \postdate{\end{center}\vspace{0.6em}}

          \renewenvironment{abstract}{%
            \begin{center}%
            \begin{minipage}{0.79\textwidth}%
            \small
            \begin{center}\bfseries Abstract\end{center}%
            \vspace{-0.45em}%
            \setlength{\parindent}{0pt}%
            \setlength{\parskip}{0.34em}%
            \ignorespaces
          }{%
            \end{minipage}%
            \end{center}%
            \vspace{0.45em}%
          }
          """

          if r"\usepackage{titlesec}" not in text:
              text = text.replace(anchor, anchor + conference_style, 1)

          # Remove any earlier global paragraph settings that would override the
          # final single-column style. The abstract receives its own spacing above.
          text = re.sub(
              r"(?m)^\setlength\{\parindent\}\{[^}]+\}\s*$",
              "",
              text,
          )
          text = re.sub(
              r"(?m)^\setlength\{\parskip\}\{[^}]+\}\s*$",
              "",
              text,
          )

          links = r"""
          \begin{center}
          \small
          \href{https://github.com/matthewvaishnav/computational-pathology-research}{\textbf{Project repository}}
          \quad$\vert$\quad
          \href{https://github.com/matthewvaishnav/computational-pathology-research/tree/main/paper/arxiv}{Paper source}
          \quad$\vert$\quad
          \href{https://github.com/matthewvaishnav/computational-pathology-research/tree/main/results}{Experimental results}
          \end{center}
          \vspace{0.25em}
          """
          if "Project repository" not in text:
              text = text.replace(r"\maketitle", r"\maketitle" + links, 1)

          calc = r"\input{identifiability_calculations.tex}"
          if calc not in text:
              text = text.replace(
                  r"\section{Limitations}",
                  calc + "\n\n" + r"\section{Limitations}",
                  1,
              )

          old = r"""\begin{align}
            \mathbb{E}[\Delta M]
            &=\Pr(H)\Pr(T=1\mid H)\mathbb{E}[M_{\mathrm{DA}}-M_{\mathrm{FA}}\mid H,T=1] \\
            &\quad+\Pr(H^c)\Pr(T=1\mid H^c)\mathbb{E}[M_{\mathrm{DA}}-M_{\mathrm{FA}}\mid H^c,T=1].
          \end{align}"""
          new = r"""\begin{align}
            \mathbb{E}[\Delta M]
            &=\Pr(H)\Pr(T=1\mid H) \\
            &\quad\times\mathbb{E}[M_{\mathrm{DA}}-M_{\mathrm{FA}}\mid H,T=1] \\
            &\quad+\Pr(H^c)\Pr(T=1\mid H^c) \\
            &\quad\times\mathbb{E}[M_{\mathrm{DA}}-M_{\mathrm{FA}}\mid H^c,T=1].
          \end{align}"""
          if old in text:
              text = text.replace(old, new, 1)

          if "twocolumn" in text:
              raise RuntimeError("Global two-column formatting remains")
          if r"\usepackage{titlesec}" not in text:
              raise RuntimeError("Single-column conference style was not applied")
          if calc not in text:
              raise RuntimeError("Calculations section was not included")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Build LaTeX PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper/arxiv/build
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Verify PDF and bibliography
        run: |
          test -s paper/arxiv/build/main.pdf
          test -f paper/arxiv/build/main.bbl
          reference_count=$(grep -c '\bibitem' paper/arxiv/build/main.bbl || true)
          echo "Rendered bibliography entries: ${reference_count}"
          test "${reference_count}" -ge 10

      - name: Upload reviewable PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/arxiv/build/main.pdf
          retention-days: 14

      - name: Create PDF-only site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p paper_pdf_site
          cp paper/arxiv/build/main.pdf paper_pdf_site/when-more-data-is-less-trustworthy.pdf
          cp paper/arxiv/build/main.pdf paper_pdf_site/when-more-data-is-less-trustworthy-references-v2.pdf
          touch paper_pdf_site/.nojekyll
          cat > paper_pdf_site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0; url=./when-more-data-is-less-trustworthy.pdf">
          <title>When More Data Is Less Trustworthy</title>
          <a href="./when-more-data-is-less-trustworthy.pdf">Open paper PDF</a>
          EOF

      - name: Deploy PDF site to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: paper_pdf_site
          publish_branch: gh-pages
          force_orphan: true
