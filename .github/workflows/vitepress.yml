name: Publish PA-NF flagship manuscript

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vitepress.yml"
      - "manuscripts/computational-pathology-foundations-v1/**"
      - "paper/paired_acquisition_preprint/**"
      - "website/foundations-site/**"
      - "CLAIM_BOUNDARY.md"
      - "README.md"
      - ".zenodo.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/vitepress.yml"
      - "manuscripts/computational-pathology-foundations-v1/**"
      - "paper/paired_acquisition_preprint/**"
      - "website/foundations-site/**"
      - "CLAIM_BOUNDARY.md"
      - "README.md"
      - ".zenodo.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundations-pages
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk lmodern poppler-utils zip \
            texlive-fonts-recommended texlive-latex-extra texlive-pictures

      - name: Validate publication sources
        shell: bash
        run: |
          set -euo pipefail
          test -s manuscripts/computational-pathology-foundations-v1/main.tex
          test -s manuscripts/computational-pathology-foundations-v1/supplement.tex
          test -s manuscripts/computational-pathology-foundations-v1/references.bib
          test -s manuscripts/computational-pathology-foundations-v1/figures/figure2_pa_nf_architecture.tex
          test -s manuscripts/computational-pathology-foundations-v1/arxiv_metadata.md
          test -s manuscripts/computational-pathology-foundations-v1/zenodo_metadata.json
          test -s website/foundations-site/index.html
          grep -Fq "Paired-Acquisition Neural Factorization:" manuscripts/computational-pathology-foundations-v1/main.tex
          grep -Fq "An End-to-End Computational Pathology Pipeline" manuscripts/computational-pathology-foundations-v1/main.tex
          grep -Fq "Preprint --- 2026-09-04" manuscripts/computational-pathology-foundations-v1/main.tex
          grep -Fq "Public preprint supplement --- 2026-09-04" manuscripts/computational-pathology-foundations-v1/supplement.tex
          grep -Fq "paired-acquisition-neural-factorization-pipeline.pdf" website/foundations-site/index.html
          if grep -Eqi "internal-review draft|internal-review supplement|not for public release|paper temporarily withdrawn|focused manuscript reconstruction" \
            website/foundations-site/index.html \
            manuscripts/computational-pathology-foundations-v1/main.tex \
            manuscripts/computational-pathology-foundations-v1/supplement.tex; then
            echo "Non-public or status-page framing found in the primary publication path"
            exit 1
          fi

          test -s paper/paired_acquisition_preprint/source_parts/part01.tex
          test -s paper/paired_acquisition_preprint/source_parts/part02.tex
          test -s paper/paired_acquisition_preprint/source_parts/part03.tex
          cat paper/paired_acquisition_preprint/source_parts/part*.tex > paper/paired_acquisition_preprint/main.tex
          echo "8fe086a4a282c98aafbca6951bf7f57013ae19ef68d38eaf7efc1717387802ba  paper/paired_acquisition_preprint/main.tex" | sha256sum -c -

      - name: Build primary PA-NF flagship manuscript
        shell: bash
        run: |
          set -euo pipefail
          cd manuscripts/computational-pathology-foundations-v1
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error supplement.tex
          test -s main.pdf
          test -s supplement.pdf
          main_pages="$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')"
          supplement_pages="$(pdfinfo supplement.pdf | awk '/^Pages:/ {print $2}')"
          echo "PA-NF flagship pages: ${main_pages}; supplement pages: ${supplement_pages}"
          test "$main_pages" -ge 10
          test "$supplement_pages" -ge 2

          if grep -Eq "Overfull \\\\hbox|Citation .* undefined|Reference .* undefined|There were undefined references|LaTeX Warning: File .* not found" main.log supplement.log; then
            echo "PA-NF LaTeX quality gate failed"
            exit 1
          fi

      - name: Build focused PA-NF representation manuscript
        shell: bash
        run: |
          set -euo pipefail
          cd paper/paired_acquisition_preprint
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          pages="$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')"
          test "$pages" -ge 5
          if grep -Eq "Overfull \\\\hbox|Citation .* undefined|Reference .* undefined|There were undefined references" main.log; then
            echo "Focused PA-NF LaTeX quality gate failed"
            exit 1
          fi

      - name: Prepare direct PDF site and source archives
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp website/foundations-site/index.html public/index.html

          # New canonical flagship filenames.
          cp manuscripts/computational-pathology-foundations-v1/main.pdf \
            public/paired-acquisition-neural-factorization-pipeline.pdf
          cp manuscripts/computational-pathology-foundations-v1/supplement.pdf \
            public/paired-acquisition-neural-factorization-pipeline-supplement.pdf
          (
            cd manuscripts/computational-pathology-foundations-v1
            zip -r "$GITHUB_WORKSPACE/public/paired-acquisition-neural-factorization-pipeline-arxiv-source.zip" \
              main.tex supplement.tex references.bib sections figures tables \
              -x '*.pdf' '*.aux' '*.bbl' '*.blg' '*.fdb_latexmk' '*.fls' '*.log' '*.out'
          )
          cp manuscripts/computational-pathology-foundations-v1/arxiv_metadata.md \
            public/panf-pipeline-arxiv-metadata.md
          cp manuscripts/computational-pathology-foundations-v1/zenodo_metadata.json \
            public/panf-pipeline-zenodo-metadata.json

          # Compatibility aliases for previously shared public URLs.
          cp manuscripts/computational-pathology-foundations-v1/main.pdf \
            public/accountable-neural-aggregation-in-computational-pathology.pdf
          cp manuscripts/computational-pathology-foundations-v1/supplement.pdf \
            public/accountable-neural-aggregation-in-computational-pathology-supplement.pdf

          # Focused representation-only paper remains available separately.
          cp paper/paired_acquisition_preprint/main.pdf public/paired-acquisition-neural-factorization.pdf
          (
            cd paper/paired_acquisition_preprint
            zip -j "$GITHUB_WORKSPACE/public/paired-acquisition-neural-factorization-arxiv-source.zip" main.tex
          )
          cp paper/paired_acquisition_preprint/arxiv_metadata.md public/pa-nf-arxiv-metadata.md
          cp paper/paired_acquisition_preprint/zenodo_metadata.json public/pa-nf-zenodo-metadata.json

          touch public/.nojekyll
          primary_sha="$(sha256sum public/paired-acquisition-neural-factorization-pipeline.pdf | awk '{print $1}')"
          supplement_sha="$(sha256sum public/paired-acquisition-neural-factorization-pipeline-supplement.pdf | awk '{print $1}')"
          secondary_sha="$(sha256sum public/paired-acquisition-neural-factorization.pdf | awk '{print $1}')"
          source_sha="$(sha256sum public/paired-acquisition-neural-factorization-pipeline-arxiv-source.zip | awk '{print $1}')"
          cat > public/publication-status.json <<JSON
          {
            "primary_paper": "Paired-Acquisition Neural Factorization: An End-to-End Computational Pathology Pipeline",
            "primary_status": "public_flagship_preprint",
            "source_commit": "${GITHUB_SHA}",
            "primary_pdf": "paired-acquisition-neural-factorization-pipeline.pdf",
            "primary_pdf_sha256": "${primary_sha}",
            "supplement": "paired-acquisition-neural-factorization-pipeline-supplement.pdf",
            "supplement_sha256": "${supplement_sha}",
            "primary_source": "paired-acquisition-neural-factorization-pipeline-arxiv-source.zip",
            "primary_source_sha256": "${source_sha}",
            "legacy_pdf_alias": "accountable-neural-aggregation-in-computational-pathology.pdf",
            "secondary_paper": "Paired-Acquisition Neural Factorization for Computational Pathology",
            "secondary_pdf": "paired-acquisition-neural-factorization.pdf",
            "secondary_pdf_sha256": "${secondary_sha}",
            "claim_boundary": "https://github.com/${GITHUB_REPOSITORY}/blob/main/CLAIM_BOUNDARY.md"
          }
          JSON

      - name: Upload publication artifact
        uses: actions/upload-artifact@v4
        with:
          name: paired-acquisition-neural-factorization-pipeline-preprint
          path: public
          retention-days: 30

      - name: Deploy direct PDF site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: public
          publish_branch: gh-pages
          force_orphan: true
