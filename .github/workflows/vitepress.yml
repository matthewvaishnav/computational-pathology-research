name: Deploy VitePress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare arXiv source package
        run: python paper/arxiv/build_arxiv_package.py

      - name: Apply compact two-column formatting and add calculations
        run: |
          cp paper/arxiv/identifiability_calculations.tex paper/arxiv/build/identifiability_calculations.tex
          python - <<'PY'
          from pathlib import Path

          path = Path("paper/arxiv/build/main.tex")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              r"\date{\today}",
              r"\date{June 10, 2026}",
              1,
          )
          text = text.replace(
              r"\documentclass[10pt]{article}",
              r"\documentclass[10pt,twocolumn]{article}",
              1,
          )
          text = text.replace(
              r"\documentclass[11pt]{article}",
              r"\documentclass[10pt,twocolumn]{article}",
              1,
          )
          text = text.replace(
              r"\usepackage[margin=0.82in]{geometry}",
              r"\usepackage[letterpaper,top=0.70in,bottom=0.75in,left=0.68in,right=0.68in,columnsep=0.24in]{geometry}",
              1,
          )
          text = text.replace(
              r"\usepackage[margin=1in]{geometry}",
              r"\usepackage[letterpaper,top=0.70in,bottom=0.75in,left=0.68in,right=0.68in,columnsep=0.24in]{geometry}",
              1,
          )

          anchor = r"\usepackage[numbers,sort&compress]{natbib}"
          compact_style = "\n".join([
              anchor,
              r"\setlength{\columnsep}{0.24in}",
              r"\setlength{\abovedisplayskip}{4pt plus 1pt minus 1pt}",
              r"\setlength{\belowdisplayskip}{4pt plus 1pt minus 1pt}",
              r"\setlength{\textfloatsep}{7pt plus 2pt minus 2pt}",
              r"\setlength{\floatsep}{6pt plus 2pt minus 2pt}",
              r"\setlength{\intextsep}{6pt plus 2pt minus 2pt}",
          ])
          if r"\setlength{\columnsep}{0.24in}" not in text:
              if anchor not in text:
                  raise RuntimeError("Could not locate natbib preamble anchor")
              text = text.replace(anchor, compact_style, 1)

          begin_document = r"\begin{document}"
          paragraph_style = "\n".join([
              r"\AtBeginDocument{%",
              r"  \setlength{\parindent}{0pt}%",
              r"  \setlength{\parskip}{0.32em plus 0.05em minus 0.03em}%",
              r"}",
              begin_document,
          ])
          if r"\AtBeginDocument{%" not in text:
              if begin_document not in text:
                  raise RuntimeError("Could not locate begin document")
              text = text.replace(begin_document, paragraph_style, 1)

          project_links = r"""
          \begin{center}
          \small
          \href{https://github.com/matthewvaishnav/computational-pathology-research}{\textbf{Project repository}}
          \quad$\vert$\quad
          \href{https://github.com/matthewvaishnav/computational-pathology-research/tree/main/paper/arxiv}{Paper source}
          \quad$\vert$\quad
          \href{https://github.com/matthewvaishnav/computational-pathology-research/tree/main/results}{Experimental results}
          \end{center}
          \vspace{0.35em}
          """

          title_marker = r"\maketitle"
          if "Project repository" not in text:
              if title_marker not in text:
                  raise RuntimeError("Could not locate maketitle")
              text = text.replace(title_marker, title_marker + project_links, 1)

          related_work = r"""\section{Related work}
          Federated optimization was established by FedAvg and subsequently extended to address statistical and systems heterogeneity through methods such as FedProx, SCAFFOLD, and FedBN. Broader surveys and non-IID data-silo studies emphasize that client heterogeneity and update drift remain central design challenges in federated learning \citep{mcmahan2017communication,li2020fedprox,karimireddy2020scaffold,li2021fedbn,li2022noniid,kairouz2021advances}.

          In medicine, federated learning has been proposed as a way to support multi-institutional modeling without centralizing sensitive data, while computational-pathology studies have demonstrated federated learning directly on gigapixel whole-slide-image tasks \citep{rieke2020future,lu2022federatedpathology}.

          The pathology pipeline in this work builds on prostate-grading benchmarks, pathology foundation representations, weakly supervised whole-slide learning, attention-based multiple-instance learning, CLAM, and transformer-based MIL \citep{bulten2022artificial,filiot2023scaling,campanella2019clinical,ilse2018attention,lu2021data,shao2021transmil}.

          """

          marker = r"\section{Contributions}"
          if r"\section{Related work}" not in text:
              if marker not in text:
                  raise RuntimeError("Could not locate Contributions section")
              text = text.replace(marker, related_work + marker, 1)

          calc_input = r"\input{identifiability_calculations.tex}"
          calc_marker = r"\section{Limitations}"
          if calc_input not in text:
              if calc_marker not in text:
                  raise RuntimeError("Could not locate Limitations section")
              text = text.replace(calc_marker, calc_input + "\n\n" + calc_marker, 1)

          old_expectation = r"""\begin{align}
  \mathbb{E}[\Delta M]
  &=\Pr(H)\Pr(T=1\mid H)\mathbb{E}[M_{\mathrm{DA}}-M_{\mathrm{FA}}\mid H,T=1] \\
  &\quad+\Pr(H^c)\Pr(T=1\mid H^c)\mathbb{E}[M_{\mathrm{DA}}-M_{\mathrm{FA}}\mid H^c,T=1].
\end{align}"""
          new_expectation = r"""\begin{align}
  \mathbb{E}[\Delta M]
  &=\Pr(H)\Pr(T=1\mid H) \\
  &\quad\times\mathbb{E}[M_{\mathrm{DA}}-M_{\mathrm{FA}}\mid H,T=1] \\
  &\quad+\Pr(H^c)\Pr(T=1\mid H^c) \\
  &\quad\times\mathbb{E}[M_{\mathrm{DA}}-M_{\mathrm{FA}}\mid H^c,T=1].
\end{align}"""
          if old_expectation not in text:
              raise RuntimeError("Could not locate overflowing expected-gain equation")
          text = text.replace(old_expectation, new_expectation, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Build LaTeX PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper/arxiv/build
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Verify bibliography expansion
        run: |
          test -f paper/arxiv/build/main.bbl
          reference_count=$(grep -c '\\bibitem' paper/arxiv/build/main.bbl || true)
          echo "Rendered bibliography entries: ${reference_count}"
          if [ "${reference_count}" -lt 10 ]; then
            echo "Expected at least 10 rendered references; refusing to deploy stale PDF."
            exit 1
          fi

      - name: Create PDF-only site
        run: |
          mkdir -p paper_pdf_site
          cp paper/arxiv/build/main.pdf paper_pdf_site/when-more-data-is-less-trustworthy-references-v2.pdf
          touch paper_pdf_site/.nojekyll
          cat > paper_pdf_site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./when-more-data-is-less-trustworthy-references-v2.pdf">
            <title>When More Data Is Less Trustworthy</title>
            <script>
              window.location.replace('./when-more-data-is-less-trustworthy-references-v2.pdf');
            </script>
          </head>
          <body>
            <p>
              Opening paper PDF:
              <a href="./when-more-data-is-less-trustworthy-references-v2.pdf">
                When More Data Is Less Trustworthy
              </a>
            </p>
          </body>
          </html>
          EOF

      - name: Deploy PDF site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: paper_pdf_site