name: Build and deploy paper PDF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-pages
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare self-contained paper source
        run: python paper/arxiv/build_arxiv_package.py

      - name: Validate result-first paper composition
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("paper/arxiv/build/main.tex")
          text = path.read_text(encoding="utf-8")

          required = (
              "Paired-Acquisition Neural Factorization",
              r"\twocolumn[",
              r"\onecolumn",
              r"\section{Introduction}",
              r"\section{The Data}",
              r"\section{The PathoAlign Model}",
              r"\section{Preventing Representation Failure}",
              r"\section{Details of Learning}",
              r"\section{Results}",
              r"\section{Discussion}",
              r"\section{Conclusion}",
              r"\input{pathoalign_model_math.tex}",
              r"\input{pathoalign_resource_allocation_figure.tex}",
              r"\input{pathoalign_figure1_benchmark_table.tex}",
              r"\input{broader_research_program.tex}",
              r"\input{identifiability_calculations.tex}",
              r"\begin{figure*}",
              r"\begin{table*}",
              "PANDA",
              "CAMELYON17",
              "PCam",
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise RuntimeError(f"Paper composition is incomplete: {missing}")

          figure1_path = Path("paper/arxiv/build/pathoalign_figure1_benchmark_table.tex")
          figure1 = figure1_path.read_text(encoding="utf-8")
          figure1_required = (
              "PathoAlign separates biological identity from acquisition identity",
              "external multi-scanner canine SCC benchmark",
              "PathoAlign biological",
              "PathoAlign acquisition",
              "Linear/RF/kNN",
              "MLP",
              "0.300",
              "0.968",
              "0.207",
              "0.972",
          )
          figure1_missing = [item for item in figure1_required if item not in figure1]
          if figure1_missing:
              raise RuntimeError(f"Figure 1 benchmark table is incomplete: {figure1_missing}")

          model_math_path = Path("paper/arxiv/build/pathoalign_model_math.tex")
          model_math = model_math_path.read_text(encoding="utf-8")
          required_math = (
              r"\mathcal{L}_{\mathrm{pair}}",
              r"\mathcal{L}_{\mathrm{recon}}",
              r"\mathcal{L}_{\mathrm{var},a}",
              r"\mathcal{L}_{\mathrm{cov},b}",
              r"\mathcal{L}_{\mathrm{scan},b}",
              r"\mathcal{L}_{\mathrm{scan},a}",
              r"\mathcal{L}_{\mathrm{dep}}",
              r"\mathcal{L}_{\mathrm{xcov}}",
              r"\operatorname{GRL}_{\gamma}",
              r"0.25\mathcal{L}_{\mathrm{var},a}",
              r"20\mathcal{L}_{\mathrm{dep}}",
              "same-region agreement and scanner suppression",
              "scanner prediction and acquisition retention",
          )
          missing_math = [item for item in required_math if item not in model_math]
          if missing_math:
              raise RuntimeError(
                  f"PathoAlign mathematical specification is incomplete: {missing_math}"
              )

          retired_architecture_terms = (
              "pathoalign_architecture_diagram",
              "pathoalign_architecture_fullpage",
              r"\pdfpageattr{/Rotate 90}",
              r"\captionof{figure}",
          )
          present_architecture_terms = [
              item for item in retired_architecture_terms if item in model_math
          ]
          if present_architecture_terms:
              raise RuntimeError(
                  "Retired PathoAlign architecture figure remains in the paper: "
                  f"{present_architecture_terms}"
              )

          forbidden = (
              "federated_pathology_pipeline_diagram",
              r"\usepackage{titling}",
              r"\maketitle",
          )
          present = [item for item in forbidden if item in text]
          if present:
              raise RuntimeError(f"Legacy paper formatting remains: {present}")

          print("Validated compact two-column main paper composition")
          print("Validated external canine Figure 1 benchmark table")
          print("Validated complete implementation-faithful PathoAlign mathematics")
          print("Validated math-only PathoAlign architecture section")
          PY

      - name: Build LaTeX PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper/arxiv/build
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Verify PDF and bibliography
        run: |
          test -s paper/arxiv/build/main.pdf
          test -s paper/arxiv/build/main.bbl
          reference_count=$(grep -F -c '\bibitem' paper/arxiv/build/main.bbl || true)
          echo "Rendered bibliography entries: ${reference_count}"
          test "${reference_count}" -ge 10

      - name: Upload reviewable PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/arxiv/build/main.pdf
          retention-days: 14

      - name: Create PDF-only site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p paper_pdf_site
          canonical="computational-pathology-research-platform-for-federated-oncology.pdf"
          cp paper/arxiv/build/main.pdf "paper_pdf_site/${canonical}"

          cp paper/arxiv/build/main.pdf paper_pdf_site/pathoalign-computational-pathology-research.pdf
          cp paper/arxiv/build/main.pdf paper_pdf_site/when-more-data-is-less-trustworthy.pdf
          cp paper/arxiv/build/main.pdf paper_pdf_site/when-more-data-is-less-trustworthy-references-v2.pdf

          touch paper_pdf_site/.nojekyll
          cat > paper_pdf_site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./computational-pathology-research-platform-for-federated-oncology.pdf">
            <title>Computational Pathology Research Platform</title>
          </head>
          <body>
            <p><a href="./computational-pathology-research-platform-for-federated-oncology.pdf">Open the computational pathology research PDF</a></p>
          </body>
          </html>
          EOF

      - name: Deploy PDF site to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: paper_pdf_site
          publish_branch: gh-pages
          force_orphan: true
