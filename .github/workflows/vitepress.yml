name: Deploy VitePress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare arXiv source package
        run: python paper/arxiv/build_arxiv_package.py

      - name: Normalize paragraph formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("paper/arxiv/build/main.tex")
          text = path.read_text(encoding="utf-8")
          anchor = r"\usepackage[numbers,sort&compress]{natbib}"
          paragraph_style = "\n".join([
              anchor,
              "",
              "% Keep every body paragraph flush left and visually separated.",
              r"\setlength{\parindent}{0pt}",
              r"\setlength{\parskip}{0.45em}",
          ])

          if r"\setlength{\parindent}{0pt}" not in text.split(r"\renewenvironment{abstract}", 1)[0]:
              if anchor not in text:
                  raise RuntimeError("Could not locate natbib preamble anchor")
              text = text.replace(anchor, paragraph_style, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Build LaTeX PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper/arxiv/build
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Create PDF-only site
        run: |
          mkdir -p paper_pdf_site
          cp paper/arxiv/build/main.pdf paper_pdf_site/when-more-data-is-less-trustworthy.pdf
          touch paper_pdf_site/.nojekyll
          cat > paper_pdf_site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./when-more-data-is-less-trustworthy.pdf">
            <title>When More Data Is Less Trustworthy</title>
            <script>
              window.location.replace('./when-more-data-is-less-trustworthy.pdf');
            </script>
          </head>
          <body>
            <p>
              Opening paper PDF:
              <a href="./when-more-data-is-less-trustworthy.pdf">
                When More Data Is Less Trustworthy
              </a>
            </p>
          </body>
          </html>
          EOF

      - name: Deploy PDF site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: paper_pdf_site
