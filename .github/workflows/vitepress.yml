name: Deploy PA-NF research site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vitepress.yml"
      - "website/pa-nf-site/**"
      - "CLAIM_BOUNDARY.md"
      - "docs/research/paired-acquisition-research-engineering-brief.md"
      - "evidence/paired_acquisition/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/vitepress.yml"
      - "website/pa-nf-site/**"
      - "CLAIM_BOUNDARY.md"
      - "docs/research/paired-acquisition-research-engineering-brief.md"
      - "evidence/paired_acquisition/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pa-nf-pages
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate focused PA-NF publication status
        shell: bash
        run: |
          set -euo pipefail
          test -s website/pa-nf-site/index.html
          test -s CLAIM_BOUNDARY.md
          test -s docs/research/paired-acquisition-research-engineering-brief.md
          test -s evidence/paired_acquisition/corrected-20260726/release_manifest.json

          grep -Fq "Paired-Acquisition Neural Factorization" website/pa-nf-site/index.html
          grep -Fq "Focused PA-NF manuscript reconstruction" website/pa-nf-site/index.html
          grep -Fq "partial structured separation" website/pa-nf-site/index.html
          grep -Fq "no supported neural feature-space increment" website/pa-nf-site/index.html

          if grep -Eqi "paper temporarily withdrawn|scientific audit hold site|full computational pathology foundations" website/pa-nf-site/index.html; then
            echo "Stale publication framing found in public site"
            exit 1
          fi

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp website/pa-nf-site/index.html public/index.html
          touch public/.nojekyll
          cat > public/publication-status.json <<EOF
          {
            "paper": "Paired-Acquisition Neural Factorization",
            "status": "focused_manuscript_reconstruction",
            "source_commit": "${GITHUB_SHA}",
            "claim_boundary": "https://github.com/${GITHUB_REPOSITORY}/blob/main/CLAIM_BOUNDARY.md",
            "corrected_evidence": "https://github.com/${GITHUB_REPOSITORY}/tree/main/evidence/paired_acquisition/corrected-20260726"
          }
          EOF

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: pa-nf-research-site
          path: public
          retention-days: 14

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: public
          publish_branch: gh-pages
          force_orphan: true
