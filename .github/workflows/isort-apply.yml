name: Apply isort Formatting

on:
  push:
    branches: [repo-cleanup-2026-06-10]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: repo-cleanup-2026-06-10
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Apply isort
        run: |
          pip install isort
          isort src/ tests/
          git diff --check
          rm .github/workflows/isort-audit.yml .github/workflows/isort-apply.yml

      - name: Commit import ordering
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply isort formatting
          branch: repo-cleanup-2026-06-10
          file_pattern: 'src tests .github/workflows/isort-audit.yml .github/workflows/isort-apply.yml'
