name: Remediation format artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatters
        run: python -m pip install black==24.10.0 isort==5.13.2
      - name: Sort and format remediation Python files
        run: |
          isort \
            experiments/paired_acquisition/run_biological_label_preservation_audit_v2.py \
            experiments/scorpion/run_pathoalign_capacity_matched_ablations.py \
            scripts/scorpion/analyze_pathoalign_crossfold_v2.py \
            src/models/transnnmil/transnnmil.py \
            src/models/transnnmil/transnnmil_branch_token.py \
            tests/experiments/test_biological_label_preservation_audit_v2.py \
            tests/models/test_transnnmil_canonical_fusion.py
          black \
            experiments/paired_acquisition/run_biological_label_preservation_audit_v2.py \
            experiments/scorpion/run_pathoalign_capacity_matched_ablations.py \
            scripts/scorpion/analyze_pathoalign_crossfold_v2.py \
            src/models/transnnmil/transnnmil.py \
            src/models/transnnmil/transnnmil_branch_token.py \
            tests/experiments/test_biological_label_preservation_audit_v2.py \
            tests/models/test_transnnmil_canonical_fusion.py
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: remediation-isort-black-formatted
          path: |
            experiments/paired_acquisition/run_biological_label_preservation_audit_v2.py
            experiments/scorpion/run_pathoalign_capacity_matched_ablations.py
            scripts/scorpion/analyze_pathoalign_crossfold_v2.py
            src/models/transnnmil/transnnmil.py
            src/models/transnnmil/transnnmil_branch_token.py
            tests/experiments/test_biological_label_preservation_audit_v2.py
            tests/models/test_transnnmil_canonical_fusion.py
          if-no-files-found: error
