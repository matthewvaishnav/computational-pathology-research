name: WSI-NCA Black one-shot

on:
  push:
    branches:
      - research/wsi-nca-phase-a-20260807
    paths:
      - .github/workflows/wsi-nca-black-once.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install repository Black version
        run: pip install "black==24.10.0"
      - name: Format WSI-NCA model
        run: black src/models/wsi_nca.py
      - name: Upload canonical formatted file
        uses: actions/upload-artifact@v4
        with:
          name: wsi-nca-black-formatted
          path: src/models/wsi_nca.py
