name: Dependency Review

# NOTE: This workflow is now integrated into the main CI workflow
# Keeping this file for reference and potential standalone use
# The dependency review runs as part of the security job in ci.yml

on:
  # Disabled - integrated into main CI workflow
  # pull_request:
  #   branches: [ main, develop ]
  workflow_dispatch:

# Concurrency controls for standalone runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: moderate
        deny-licenses: GPL-2.0, GPL-3.0
        comment-summary-in-pr: always
