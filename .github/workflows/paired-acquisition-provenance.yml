name: Paired-acquisition provenance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/paired-acquisition-provenance.yml"
      - "benchmarks/paired_acquisition_provenance_release/**"
      - "docs/research/paired-acquisition-provenance-v1.md"
      - "docs/research/paired-acquisition-real-producer-adoption.md"
      - "docs/research/paired-acquisition-factorial-preregistration.md"
      - "experiments/paired_acquisition/run_provenance_bound_bottleneck_cell.py"
      - "experiments/paired_acquisition/run_provenance_bound_factorial_smoke.py"
      - "experiments/paired_acquisition/run_provenance_bound_factorial_full.py"
      - "results/paired_acquisition_factorial/.gitignore"
      - "scripts/provenance/**"
      - "src/paired_acquisition_factorial.py"
      - "src/paired_acquisition_factorial_full.py"
      - "src/paired_acquisition_provenance.py"
      - "src/paired_acquisition_release_writer.py"
      - "tests/test_paired_acquisition_factorial.py"
      - "tests/test_paired_acquisition_factorial_full.py"
      - "tests/test_paired_acquisition_provenance.py"
      - "tests/test_paired_acquisition_release_writer.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/paired-acquisition-provenance.yml"
      - "benchmarks/paired_acquisition_provenance_release/**"
      - "docs/research/paired-acquisition-provenance-v1.md"
      - "docs/research/paired-acquisition-real-producer-adoption.md"
      - "docs/research/paired-acquisition-factorial-preregistration.md"
      - "experiments/paired_acquisition/run_provenance_bound_bottleneck_cell.py"
      - "experiments/paired_acquisition/run_provenance_bound_factorial_smoke.py"
      - "experiments/paired_acquisition/run_provenance_bound_factorial_full.py"
      - "results/paired_acquisition_factorial/.gitignore"
      - "scripts/provenance/**"
      - "src/paired_acquisition_factorial.py"
      - "src/paired_acquisition_factorial_full.py"
      - "src/paired_acquisition_provenance.py"
      - "src/paired_acquisition_release_writer.py"
      - "tests/test_paired_acquisition_factorial.py"
      - "tests/test_paired_acquisition_factorial_full.py"
      - "tests/test_paired_acquisition_provenance.py"
      - "tests/test_paired_acquisition_release_writer.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test runner
        run: python -m pip install "pytest>=7.3,<8"
      - name: Validate tracked release
        run: python scripts/provenance/validate_paired_acquisition_release.py
      - name: Compile real producer and factorial gates
        run: >-
          python -m py_compile
          src/paired_acquisition_release_writer.py
          src/paired_acquisition_factorial.py
          src/paired_acquisition_factorial_full.py
          experiments/paired_acquisition/run_provenance_bound_bottleneck_cell.py
          experiments/paired_acquisition/run_provenance_bound_factorial_smoke.py
          experiments/paired_acquisition/run_provenance_bound_factorial_full.py
          scripts/provenance/validate_paired_acquisition_factorial_release.py
          scripts/provenance/validate_paired_acquisition_factorial_full_release.py
      - name: Run fail-closed contract tests
        run: >-
          pytest -q -o addopts=''
          tests/test_paired_acquisition_provenance.py
          tests/test_paired_acquisition_release_writer.py
          tests/test_paired_acquisition_factorial.py
          tests/test_paired_acquisition_factorial_full.py
