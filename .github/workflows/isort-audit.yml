name: isort Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isort-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install isort
        run: pip install isort

      - name: Capture isort diff
        shell: bash
        run: |
          set +e
          isort --check-only --diff src/ tests/ > isort.diff 2>&1
          status=$?
          echo "$status" > isort.status
          cat isort.diff
          exit 0

      - name: Upload isort audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isort-audit
          path: |
            isort.diff
            isort.status
          if-no-files-found: error
          retention-days: 7
