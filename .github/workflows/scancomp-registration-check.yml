name: ScanComp registration unit QC
on:
  push:
    branches:
      - scancomp/registration-qc-20261110
  pull_request:
    branches:
      - scancomp/first-ifd-bigtiff-adapter-20261109
permissions:
  contents: read
jobs:
  registration-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight geometric test dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'opencv-python-headless>=4.8,<5' 'pytest>=8,<10' 'black==24.10.0'
      - name: Black format and Python syntax checks
        run: |
          black --check scripts/external_multiscanner/scancomp_registration_qc.py tests/test_scancomp_registration_qc.py
          python -m compileall -q scripts/external_multiscanner/scancomp_registration_qc.py tests/test_scancomp_registration_qc.py
      - name: Run deterministic synthetic geometry tests (not patient data)
        run: python -m pytest tests/test_scancomp_registration_qc.py -q -o addopts=
