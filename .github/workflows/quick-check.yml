name: Quick Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quick-test:
    name: Quick Test (Ubuntu Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openslide-tools

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run quick tests (no slow/property/integration tests)
      run: |
        pytest tests/ \
          --ignore=tests/integration \
          --ignore=tests/foundation/test_foundation_model_integration.py \
          -q --tb=short \
          -m "not property and not slow and not integration" \
          --maxfail=1 \
          --junitxml=quick-test-results.xml
      timeout-minutes: 10

    - name: Upload quick-test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quick-test-report
        path: quick-test-results.xml
        if-no-files-found: ignore
        retention-days: 14

    - name: Quick lint check
      run: |
        pip install flake8 black
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check --diff src/ || echo "Black formatting issues found"
      continue-on-error: true

  import-test:
    name: Import Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install minimal dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-core.txt

    - name: Test core imports
      run: |
        python -c "
        try:
            import src
            import src.models
            import src.data
            import src.training
            print('Core imports successful')
        except Exception as e:
            print(f'Import failed: {e}')
            exit(1)
        "
