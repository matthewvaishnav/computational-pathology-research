name: Quick Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quick-test:
    name: Quick Test (Ubuntu Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openslide-tools
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    
    - name: Run quick tests (no slow/property tests)
      run: |
        pytest tests/ -v -m "not property and not slow and not integration" --maxfail=5 -x
      timeout-minutes: 10
    
    - name: Quick lint check
      run: |
        pip install flake8 black
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check --diff src/ || echo "Black formatting issues found"
      continue-on-error: true

  import-test:
    name: Import Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install minimal dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision numpy pandas scikit-learn
    
    - name: Test core imports
      run: |
        python -c "
        try:
            import src
            import src.models
            import src.data
            import src.training
            print('✓ Core imports successful')
        except Exception as e:
            print(f'✗ Import failed: {e}')
            exit(1)
        "