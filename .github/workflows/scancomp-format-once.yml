name: ScanComp one-shot code formatting
on:
  push:
    branches:
      - scancomp/first-ifd-bigtiff-adapter-20261109
      - scancomp/registration-qc-20261110
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format only ScanComp files
        run: |
          python -m pip install black==24.10.0
          black src/data/wsi_pipeline/reader.py src/data/wsi_pipeline/scancomp_tiff.py tests/test_scancomp_tiff_reader.py scripts/external_multiscanner/scancomp_validate_wsi.py
          if [ -f scripts/external_multiscanner/scancomp_registration_qc.py ]; then
            black scripts/external_multiscanner/scancomp_registration_qc.py tests/test_scancomp_registration_qc.py
          fi
          git status --short
          if ! git diff --quiet -- src/data/wsi_pipeline/reader.py src/data/wsi_pipeline/scancomp_tiff.py tests/test_scancomp_tiff_reader.py scripts/external_multiscanner/scancomp_validate_wsi.py scripts/external_multiscanner/scancomp_registration_qc.py tests/test_scancomp_registration_qc.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/wsi_pipeline/reader.py src/data/wsi_pipeline/scancomp_tiff.py tests/test_scancomp_tiff_reader.py scripts/external_multiscanner/scancomp_validate_wsi.py
            if [ -f scripts/external_multiscanner/scancomp_registration_qc.py ]; then
              git add scripts/external_multiscanner/scancomp_registration_qc.py tests/test_scancomp_registration_qc.py
            fi
            git commit -m "style: apply Black to ScanComp intake and registration code"
            git push origin "HEAD:refs/heads/${{ github.ref_name }}"
          fi
