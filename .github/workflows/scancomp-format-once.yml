name: ScanComp formatting export for review
on:
  push:
    branches:
      - scancomp/first-ifd-bigtiff-adapter-20261109
      - scancomp/registration-qc-20261110
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Emit exact Black-formatted source snapshots for connector review
        run: |
          python -m pip install black==24.10.0
          black src/data/wsi_pipeline/reader.py src/data/wsi_pipeline/scancomp_tiff.py tests/test_scancomp_tiff_reader.py scripts/external_multiscanner/scancomp_validate_wsi.py
          if [ -f scripts/external_multiscanner/scancomp_registration_qc.py ]; then
            black scripts/external_multiscanner/scancomp_registration_qc.py tests/test_scancomp_registration_qc.py
          fi
          for file in src/data/wsi_pipeline/scancomp_tiff.py tests/test_scancomp_tiff_reader.py scripts/external_multiscanner/scancomp_validate_wsi.py scripts/external_multiscanner/scancomp_registration_qc.py tests/test_scancomp_registration_qc.py; do
            if [ -f "$file" ]; then
              echo "SCANCOMP_FORMAT_START::$file"
              base64 -w0 "$file"
              echo
              echo "SCANCOMP_FORMAT_END::$file"
            fi
          done
