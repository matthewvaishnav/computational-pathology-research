template_id: wsi_streaming_architecture
name: WSI Streaming Architecture
category: architecture_design
version: 1.0.0
description: Design real-time whole slide image streaming architecture
parameters:
  - name: system_name
    required: true
    type: string
    description: Name of the WSI streaming system
  - name: tile_size
    required: false
    type: number
    default: 256
    description: Tile size in pixels
  - name: compression
    required: false
    type: string
    default: jpeg
    description: Image compression format
  - name: caching_strategy
    required: false
    type: string
    default: lru
    description: Tile caching strategy
context_requirements:
  - architecture_docs
  - code_snippets
  - constraints
expected_artifacts:
  - type: mermaid_diagram
    subtype: architecture
  - type: openapi_spec
    format: yaml
  - type: implementation_guide
    granularity: detailed
prompt_template: >-
  Design a WSI streaming architecture for {{system_name}}.


  **Tile Size:** {{tile_size}}px

  **Compression:** {{compression}}

  **Caching Strategy:** {{caching_strategy}}


  Please provide:

  1. System architecture diagram (Mermaid) showing tile server, cache, and
  client

  2. Streaming API specification (OpenAPI YAML) for tile requests

  3. Implementation plan with performance optimization strategies


  Consider the following context:

  {{context_bundle}}
