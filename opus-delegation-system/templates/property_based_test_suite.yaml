template_id: property_based_test_suite
name: Property-Based Test Suite Design
category: test_strategy
version: 1.0.0
description: Design comprehensive property-based test suite
parameters:
  - name: component_name
    required: true
    type: string
    description: Name of the component to test
  - name: properties
    required: true
    type: list
    description: Properties to verify (e.g., idempotence, commutativity, invariants)
  - name: test_framework
    required: false
    type: string
    default: fast-check
    description: Property-based testing framework
  - name: coverage_target
    required: false
    type: number
    default: 90
    description: Target code coverage percentage
context_requirements:
  - code_snippets
  - test_files
  - requirements_docs
expected_artifacts:
  - type: test_strategy
    granularity: detailed
  - type: code_snippet
    subtype: test_stubs
  - type: implementation_guide
    granularity: detailed
prompt_template: |-
  Design a property-based test suite for {{component_name}}.

  **Properties to Verify:** {{properties}}
  **Test Framework:** {{test_framework}}
  **Coverage Target:** {{coverage_target}}%

  Please provide:
  1. Test strategy document with property definitions and generators
  2. Test code stubs with property-based test examples
  3. Implementation plan for achieving coverage target

  Consider the following context:
  {{context_bundle}}
