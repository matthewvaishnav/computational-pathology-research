template_id: refactoring_analysis
name: Refactoring Analysis
category: refactoring_analysis
version: 1.0.0
description: Analyze code for refactoring opportunities and create refactoring plan
parameters:
  - name: target_component
    required: true
    type: string
    description: Component or module to refactor
  - name: refactoring_goals
    required: true
    type: list
    description: Refactoring goals (e.g., reduce complexity, improve testability,
      extract interfaces)
  - name: constraints
    required: false
    type: list
    default: []
    description: Refactoring constraints (e.g., maintain API compatibility, no
      breaking changes)
  - name: risk_tolerance
    required: false
    type: string
    default: medium
    description: Risk tolerance (low, medium, high)
context_requirements:
  - code_snippets
  - dependency_graphs
  - test_files
  - architecture_docs
expected_artifacts:
  - type: mermaid_diagram
    subtype: class
  - type: implementation_guide
    granularity: detailed
  - type: code_snippet
    subtype: refactored_examples
prompt_template: |-
  Analyze {{target_component}} for refactoring opportunities.

  **Refactoring Goals:** {{refactoring_goals}}
  **Constraints:** {{constraints}}
  **Risk Tolerance:** {{risk_tolerance}}

  Please provide:
  1. Current vs. proposed architecture diagram (Mermaid class diagram)
  2. Refactoring plan with step-by-step instructions and risk assessment
  3. Code examples showing before/after refactoring

  Consider the following context:
  {{context_bundle}}
