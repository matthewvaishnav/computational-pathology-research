# PACS Integration System - Production Configuration
# This configuration is for production hospital deployment

profile: production

# PACS Endpoints Configuration
pacs_endpoints:
  primary:
    endpoint_id: "primary_pacs"
    ae_title: "HISTOCORE_PROD"
    host: "pacs.hospital.org"
    port: 11112
    vendor: "GE"  # Options: GE, Philips, Siemens, Agfa
    description: "Primary hospital PACS system"
    
    security:
      tls_enabled: true
      tls_version: "1.3"
      certificate_path: "/etc/ssl/certs/pacs.crt"
      client_cert_path: "/etc/ssl/private/histocore.crt"
      client_key_path: "/etc/ssl/private/histocore.key"
      ca_bundle_path: "/etc/ssl/certs/ca-bundle.crt"
      verify_certificates: true
      mutual_authentication: true
    
    performance:
      connection_timeout: 30
      query_timeout: 30
      retrieval_timeout: 300
      storage_timeout: 60
      max_retries: 5
      initial_backoff_seconds: 2
  
  backup:
    endpoint_id: "backup_pacs"
    ae_title: "HISTOCORE_BACKUP"
    host: "pacs-backup.hospital.org"
    port: 11112
    vendor: "GE"
    description: "Backup PACS system for failover"
    
    security:
      tls_enabled: true
      tls_version: "1.3"
      certificate_path: "/etc/ssl/certs/pacs-backup.crt"
      client_cert_path: "/etc/ssl/private/histocore.crt"
      client_key_path: "/etc/ssl/private/histocore.key"
      ca_bundle_path: "/etc/ssl/certs/ca-bundle.crt"
      verify_certificates: true
      mutual_authentication: true
    
    performance:
      connection_timeout: 30
      query_timeout: 30
      retrieval_timeout: 300
      storage_timeout: 60
      max_retries: 5
      initial_backoff_seconds: 2

# Performance Configuration
performance:
  max_concurrent_studies: 50
  connection_pool_size: 10
  max_transfer_rate_mbps: 100
  disk_space_threshold_gb: 50

# Storage Configuration
storage:
  local_cache_path: "/var/histocore/pacs_cache"
  max_cache_size_gb: 500
  cleanup_threshold_gb: 50
  auto_cleanup_enabled: true
  retention_days: 30

# Workflow Configuration
workflow:
  poll_interval: "5m"  # 5 minutes
  auto_start_polling: true
  priority_processing_enabled: true
  max_processing_time_minutes: 60

# Error Handling Configuration
error_handling:
  max_retries: 5
  initial_backoff_seconds: 2
  max_backoff_seconds: 60
  exponential_backoff_multiplier: 2
  dead_letter_queue_path: "/var/histocore/dlq"
  dead_letter_queue_max_size: 1000
  auto_retry_enabled: true
  retry_interval_minutes: 15

# Failover Configuration
failover:
  enabled: true
  health_check_interval_seconds: 60
  failure_threshold: 3
  recovery_threshold: 2
  auto_failover_enabled: true

# Audit Logging Configuration
audit:
  enabled: true
  log_directory: "/var/log/histocore/pacs_audit"
  retention_days: 2555  # 7 years for HIPAA compliance
  enable_encryption: true
  encryption_key_path: "/etc/histocore/audit_encryption.key"
  log_format: "json"
  include_phi_details: true
  tamper_evident_enabled: true

# Notification Configuration
notifications:
  enabled: true
  
  email:
    enabled: true
    smtp_host: "smtp.hospital.org"
    smtp_port: 587
    smtp_use_tls: true
    smtp_username: "histocore@hospital.org"
    smtp_password_env: "HISTOCORE_SMTP_PASSWORD"
    from_address: "histocore@hospital.org"
    admin_addresses:
      - "pacs-admin@hospital.org"
      - "it-support@hospital.org"
    pathologist_addresses:
      - "pathology-team@hospital.org"
  
  sms:
    enabled: false
    provider: "twilio"
    account_sid_env: "TWILIO_ACCOUNT_SID"
    auth_token_env: "TWILIO_AUTH_TOKEN"
    from_number: "+1234567890"
    admin_numbers:
      - "+1234567891"
  
  hl7:
    enabled: true
    host: "hl7.hospital.org"
    port: 2575
    use_tls: true
    facility: "HISTOCORE"
    application: "AI_PATHOLOGY"

# Logging Configuration
logging:
  level: "INFO"
  format: "json"
  output: "file"
  file_path: "/var/log/histocore/pacs_service.log"
  max_file_size_mb: 100
  backup_count: 10
  include_timestamps: true
  include_thread_info: true
