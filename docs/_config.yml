title: HistoCore
description: Production-grade PyTorch framework for computational pathology research with 5,071 tests, 8-12x training optimization, 95.37% validation AUC, federated learning, and PACS integration
theme: jekyll-theme-minimal
logo: /assets/logo.svg?v=2
show_downloads: true
github:
  repository_url: https://github.com/matthewvaishnav/computational-pathology-research
  is_project_page: true
  owner_name: Matthew Vaishnav
  owner_url: https://github.com/matthewvaishnav

# Clean URLs (remove .html extension)
permalink: pretty

# Navigation
navigation:
  - title: Home
    url: /
  - title: Documentation
    url: /DOCS_INDEX
  - title: GitHub
    url: https://github.com/matthewvaishnav/computational-pathology-research

# Plugins
plugins:
  - jekyll-relative-links

# Relative links configuration
relative_links:
  enabled: true
  collections: true

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Exclude from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
