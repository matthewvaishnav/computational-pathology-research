      - evidence/paired_acquisition/scorpion-capacity-matched-20260726
    evidence_status: >-
      Promoted, provenance-complete corrected evidence plus the separately
      versioned valid 175/175-fit SCORPION capacity-matched campaign.
    claim_boundary: >-
      SCORPION supports a controlled comparative advantage over the registered
      equal-capacity two-branch neural control on the structured-separation
      objective. The canine fixed-estimand result separately does not establish
      an additional neural feature-space improvement over the strongest simple
      scanner-removal baselines. Neither result supports universal superiority,
      pure biological factors, scanner invariance, or clinical utility.
