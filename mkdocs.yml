site_name: Computational Pathology Research
site_description: Documentation for computational pathology, federated learning, FAIR-WEIGHTS-H, and validation reports.
site_url: https://matthewvaishnav.github.io/computational-pathology-research/
repo_url: https://github.com/matthewvaishnav/computational-pathology-research
repo_name: matthewvaishnav/computational-pathology-research

use_directory_urls: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Start:
      - Getting Started: getting-started.md
      - Repository Overview: repository-overview.md
      - Platform Overview: platform-overview.md
  - Results:
      - PCam Results: results/pcam-results.md
      - Performance Comparison: results/performance-comparison.md
  - FAIR-WEIGHTS-H:
      - Theory and Protocol: theory/fair-weights-h.md
      - Implementation Status: theory/implementation-status.md
      - Synthetic Report: validation/synthetic-report.md
      - PCam Smoke Report: validation/pcam-smoke-report.md
      - PCam Benchmark Plan: validation/PCAM_FEDERATED_BENCHMARK_PLAN.md
      - Camelyon17 Plan: validation/camelyon17-plan.md
  - Engineering:
      - Architecture: engineering/architecture.md
      - Benchmark System: engineering/benchmark-system.md
      - Security Hardening: engineering/security-hardening.md
      - Federated Test Status: engineering/testing-status.md
  - Changelog: changelog.md
