site_name: Computational Pathology Research
site_description: Documentation for computational pathology, federated learning, FAIR-WEIGHTS-H, and validation reports.
site_url: https://matthewvaishnav.github.io/computational-pathology-research/
repo_url: https://github.com/matthewvaishnav/computational-pathology-research
repo_name: matthewvaishnav/computational-pathology-research

use_directory_urls: true

exclude_docs: |
  ABOUT.md
  ANALYSIS_SYSTEM.md
  API_REFERENCE.md
  ARCHITECTURE.md
  ARCHITECTURE_MIGRATION.md
  BENCHMARK_SYSTEM.md
  CHANGELOG.md
  DOCS_INDEX.md
  FAIR_WEIGHTS_HYBRID_PROTOCOL.md
  FAIR_WEIGHTS_H_IMPLEMENTATION_STATUS.md
  FAIR_WEIGHTS_H_PCAM_FEDERATED_SMOKE_REPORT.md
  GETTING_STARTED.md
  PCAM_REAL_RESULTS.md
  PERFORMANCE_COMPARISON.md
  PLATFORM_OVERVIEW.md
  REPOSITORY_OVERVIEW.md
  SECURITY_HARDENING.md
  TESTING_SUMMARY.md
  TRANSNNMIL_V2_ARCHITECTURE.md
  TRANSNNMIL_V2_STATUS.md
  TRANSNNMIL_V2_TRAINING.md
  archive/**
  api/**
  demo/**
  deployment/**
  diagrams/**
  federated_learning/**
  operations/**
  regulatory/**
  security/**
  training/**

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Overview:
      - What this project is: overview/index.md
      - Repository structure: repository-overview.md
      - Platform overview: platform-overview.md
      - Claim status: overview/claim-status.md
  - Quickstart:
      - Getting started: getting-started.md
      - Reproducing experiments: quickstart/reproducing-experiments.md
      - Running benchmarks: quickstart/running-benchmarks.md
  - Models:
      - Models overview: models/index.md
      - TransnnMIL v2.0: models/transnnmil-v2.md
      - Foundation encoders: models/foundation-encoders.md
      - Model cards: models/model-cards.md
  - Federated Learning:
      - PathologyFL: federated/pathologyfl.md
      - FAIR-WEIGHTS-H: theory/fair-weights-h.md
      - Implementation status: theory/implementation-status.md
      - Privacy and DP: federated/privacy-dp.md
      - Secure aggregation: federated/secure-aggregation.md
      - Byzantine robustness: federated/byzantine-robustness.md
  - Validation:
      - Validation overview: validation/index.md
      - Synthetic validation: validation/synthetic-report.md
      - PCam smoke report: validation/pcam-smoke-report.md
      - PCam benchmark plan: validation/PCAM_FEDERATED_BENCHMARK_PLAN.md
      - Camelyon17 plan: validation/camelyon17-plan.md
  - Results:
      - PCam results: results/pcam-results.md
      - Performance comparison: results/performance-comparison.md
  - Engineering:
      - Architecture: engineering/architecture.md
      - Testing status: engineering/testing-status.md
      - Benchmark system: engineering/benchmark-system.md
      - Security hardening: engineering/security-hardening.md
      - Deployment: engineering/deployment.md
  - Roadmap:
      - Roadmap: roadmap/index.md
      - Limitations: roadmap/limitations.md
  - Changelog: changelog.md
